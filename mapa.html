<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VEX · Ajustar o ponto</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, system-ui, sans-serif; }
  #mapa { position: absolute; inset: 0; }
  .topo { position: absolute; z-index: 1000; top: 8px; left: 8px; right: 8px; background: rgba(255,255,255,.95);
          border-radius: 10px; padding: 8px 10px; font-size: 14px; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  .topo b { color: #1b4fd1; }
  .botoes { position: absolute; z-index: 1000; right: 8px; bottom: 90px; display: flex; flex-direction: column; gap: 8px; }
  .botoes button { border: 0; border-radius: 22px; padding: 10px 14px; font-size: 14px; background: #fff;
                   box-shadow: 0 1px 6px rgba(0,0,0,.3); }
  #confirmar { position: absolute; z-index: 1000; left: 8px; right: 8px; bottom: 16px; border: 0; border-radius: 12px;
               padding: 14px; font-size: 16px; font-weight: 600; color: #fff; background: #1f9d55; display: none; }
  .leg { font-size: 12px; color: #444; margin-top: 4px; }
  .bola { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 3px 0 6px; vertical-align: middle; }
  /* CTO igual à tela de vendas: sempre do mesmo tamanho na tela, cor pela ocupação, portas livres no meio */
  .cto { position: relative; width: 22px; height: 22px; border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.45); }
  .cto .num { position: absolute; left: 4px; top: 5px; width: 14px; height: 11px; background: #fff; border-radius: 2px;
              font: 700 8px/11px Arial, sans-serif; text-align: center; }
  .cto .pe { position: absolute; left: 9px; bottom: -5px; width: 4px; height: 5px; background: inherit; border-radius: 0 0 2px 2px; }
  .pop b { color: #1b4fd1; } .pop ul { margin: 4px 0 0; padding-left: 16px; max-height: 180px; overflow-y: auto; }
</style>
</head>
<body>
<div id="mapa"></div>
<div class="topo">
  📍 <b>Arraste o pin</b> (ou toque no mapa) até a <b>casa do cliente</b>.
  <div class="leg">círculo = 300 m · nº = portas livres · toque na caixa para detalhes<br>
    <span class="bola" style="background:#f55203"></span>vazia<span class="bola" style="background:#008000"></span>até 25%<span class="bola" style="background:#163ba3"></span>até 60%<span class="bola" style="background:#FF0000"></span>quase cheia<span class="bola" style="background:#000"></span>lotada<span class="bola" style="background:#9c00bf"></span>projeto</div>
</div>
<div class="botoes">
  <button id="sat">🛰 Satélite</button>
  <button id="eu">🎯 Onde estou</button>
</div>
<button id="confirmar">✅ Confirmar este ponto</button>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const q = new URLSearchParams(location.hash.slice(1));
  const ini = [parseFloat(q.get("lat")) || -19.92, parseFloat(q.get("lng")) || -43.94];
  const mapa = L.map("mapa", { zoomControl: false }).setView(ini, 18);
  const ruas = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" });
  const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                          { maxZoom: 19, attribution: "© Esri" });
  ruas.addTo(mapa);
  let modoSat = false;
  document.getElementById("sat").onclick = () => {
    modoSat = !modoSat;
    if (modoSat) { mapa.removeLayer(ruas); sat.addTo(mapa); } else { mapa.removeLayer(sat); ruas.addTo(mapa); }
    document.getElementById("sat").textContent = modoSat ? "🗺 Ruas" : "🛰 Satélite";
  };
  // CTOs: "lat,lng,tipo,livres,total,nome" (tipo a = implantada, r = projeto). Clientes (só VEX): k = "i:end|end~i:..."
  const clientes = {};
  (q.get("k") || "").split("~").filter(Boolean).forEach(t => {
    const p = t.indexOf(":"); clientes[t.slice(0, p)] = t.slice(p + 1).split("|").filter(Boolean);
  });
  const esc = t => String(t || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const corDa = (tipo, livres, total) => {
    if (tipo === "r") return "#9c00bf";
    if (livres === "" || total === "" || +total <= 0) return livres === "0" ? "#000000" : "#8a8a8a";
    if (+livres <= 0) return "#000000";
    const oc = (+total - +livres) / +total * 100;
    if (oc <= 0) return "#f55203";
    if (oc <= 25) return "#008000";
    if (oc <= 60) return "#163ba3";
    return "#FF0000";
  };
  (q.get("c") || "").split(";").filter(Boolean).forEach((t, i) => {
    const [la, ln, tipo, livres = "", total = "", nome = ""] = t.split(",");
    const cor = corDa(tipo, livres, total);
    const num = tipo === "r" ? "P" : (livres === "" ? "?" : String(livres).padStart(2, "0"));
    const icone = L.divIcon({ className: "", iconSize: [22, 27], iconAnchor: [11, 27], popupAnchor: [0, -26],
      html: `<div class="cto" style="background:${cor}"><div class="num" style="color:${cor}">${num}</div><div class="pe"></div></div>` });
    let txt = `<div class="pop"><b>${esc(nome || "CTO")}</b><br>`;
    if (tipo === "r") txt += "Projeto (ainda não implantada)";
    else if (livres === "") txt += "Portas: não consultadas agora";
    else txt += `${livres} porta(s) livre(s) de ${total}` + (+total > 0 ? ` · ${Math.round((+total - +livres) / +total * 100)}% ocupada` : "");
    const cl = clientes[String(i)];
    if (cl) txt += `<br><br>👥 <b>${cl.length} cliente(s) ativo(s):</b><ul>` + cl.map(e => `<li>${esc(e)}</li>`).join("") + "</ul>";
    L.marker([+la, +ln], { icon: icone, zIndexOffset: -100 }).bindPopup(txt + "</div>").addTo(mapa);
  });
  const pin = L.marker(ini, { draggable: true, autoPan: true }).addTo(mapa);
  const circ = L.circle(ini, { radius: 300, color: "#1b4fd1", weight: 2, fillOpacity: 0.06 }).addTo(mapa);
  const mover = ll => { pin.setLatLng(ll); circ.setLatLng(ll); };
  pin.on("drag", e => circ.setLatLng(e.target.getLatLng()));
  mapa.on("click", e => mover(e.latlng));
  document.getElementById("eu").onclick = () => navigator.geolocation && navigator.geolocation.getCurrentPosition(
    p => { const ll = [p.coords.latitude, p.coords.longitude]; mover(ll); mapa.setView(ll, 18); },
    () => alert("Não consegui pegar a sua localização."), { enableHighAccuracy: true, timeout: 10000 });
  const enviar = () => {
    const ll = pin.getLatLng();
    const robo = q.get("b"), inicio = q.get("s");
    if (robo && inicio) {
      // botão dentro da mensagem: o ponto volta como /start <inicio>_<lat*1e6>_<lng*1e6>
      const link = "https://t.me/" + robo + "?start=" + inicio + "_" + Math.round(ll.lat * 1e6) + "_" + Math.round(ll.lng * 1e6);
      if (tg && tg.openTelegramLink) { tg.openTelegramLink(link); setTimeout(() => tg.close(), 400); }
      else { location.href = link; }
      return;
    }
    const dados = JSON.stringify({ tipo: "viab", lat: +ll.lat.toFixed(7), lng: +ll.lng.toFixed(7) });
    if (tg && tg.sendData) { tg.sendData(dados); } else { alert("Ponto: " + ll.lat.toFixed(6) + ", " + ll.lng.toFixed(6)); }
  };
  if (tg && tg.MainButton && tg.initData !== undefined) {
    tg.MainButton.setText("✅ Confirmar este ponto");
    tg.MainButton.color = "#1f9d55";
    tg.MainButton.onClick(enviar);
    tg.MainButton.show();
  } else {
    const b = document.getElementById("confirmar"); b.style.display = "block"; b.onclick = enviar;
  }
</script>
</body>
</html>
