<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VEX · Ajustar o ponto</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, system-ui, sans-serif; }
  #mapa { position: absolute; inset: 0; }
  .topo { position: absolute; z-index: 1000; top: 8px; left: 8px; right: 8px; background: rgba(255,255,255,.95);
          border-radius: 10px; padding: 8px 10px; font-size: 14px; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
  .topo b { color: #1b4fd1; }
  .botoes { position: absolute; z-index: 1000; right: 8px; bottom: 90px; display: flex; flex-direction: column; gap: 8px; }
  .botoes button { border: 0; border-radius: 22px; padding: 10px 14px; font-size: 14px; background: #fff;
                   box-shadow: 0 1px 6px rgba(0,0,0,.3); }
  #confirmar { position: absolute; z-index: 1000; left: 8px; right: 8px; bottom: 16px; border: 0; border-radius: 12px;
               padding: 14px; font-size: 16px; font-weight: 600; color: #fff; background: #1f9d55; display: none; }
  .leg { font-size: 12px; color: #444; margin-top: 4px; }
  .bola { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 3px 0 8px; vertical-align: middle; }
</style>
</head>
<body>
<div id="mapa"></div>
<div class="topo">
  📍 <b>Arraste o pin</b> (ou toque no mapa) até a <b>casa do cliente</b>.
  <div class="leg">círculo = 300 m<span class="bola" style="background:#f59e0b"></span>CTO<span class="bola" style="background:#9c00bf"></span>projeto</div>
</div>
<div class="botoes">
  <button id="sat">🛰 Satélite</button>
  <button id="eu">🎯 Onde estou</button>
</div>
<button id="confirmar">✅ Confirmar este ponto</button>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const q = new URLSearchParams(location.hash.slice(1));
  const ini = [parseFloat(q.get("lat")) || -19.92, parseFloat(q.get("lng")) || -43.94];
  const mapa = L.map("mapa", { zoomControl: false }).setView(ini, 18);
  const ruas = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" });
  const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                          { maxZoom: 19, attribution: "© Esri" });
  ruas.addTo(mapa);
  let modoSat = false;
  document.getElementById("sat").onclick = () => {
    modoSat = !modoSat;
    if (modoSat) { mapa.removeLayer(ruas); sat.addTo(mapa); } else { mapa.removeLayer(sat); ruas.addTo(mapa); }
    document.getElementById("sat").textContent = modoSat ? "🗺 Ruas" : "🛰 Satélite";
  };
  (q.get("c") || "").split(";").filter(Boolean).forEach(t => {
    const [la, ln, tipo] = t.split(",");
    L.circleMarker([+la, +ln], { radius: 7, weight: 2, color: "#fff", fillOpacity: 1,
                                fillColor: tipo === "r" ? "#9c00bf" : "#f59e0b" }).addTo(mapa);
  });
  const pin = L.marker(ini, { draggable: true, autoPan: true }).addTo(mapa);
  const circ = L.circle(ini, { radius: 300, color: "#1b4fd1", weight: 2, fillOpacity: 0.06 }).addTo(mapa);
  const mover = ll => { pin.setLatLng(ll); circ.setLatLng(ll); };
  pin.on("drag", e => circ.setLatLng(e.target.getLatLng()));
  mapa.on("click", e => mover(e.latlng));
  document.getElementById("eu").onclick = () => navigator.geolocation && navigator.geolocation.getCurrentPosition(
    p => { const ll = [p.coords.latitude, p.coords.longitude]; mover(ll); mapa.setView(ll, 18); },
    () => alert("Não consegui pegar a sua localização."), { enableHighAccuracy: true, timeout: 10000 });
  const enviar = () => {
    const ll = pin.getLatLng();
    const dados = JSON.stringify({ tipo: "viab", lat: +ll.lat.toFixed(7), lng: +ll.lng.toFixed(7) });
    if (tg && tg.sendData) { tg.sendData(dados); } else { alert("Ponto: " + ll.lat.toFixed(6) + ", " + ll.lng.toFixed(6)); }
  };
  if (tg && tg.MainButton && tg.initData !== undefined) {
    tg.MainButton.setText("✅ Confirmar este ponto");
    tg.MainButton.color = "#1f9d55";
    tg.MainButton.onClick(enviar);
    tg.MainButton.show();
  } else {
    const b = document.getElementById("confirmar"); b.style.display = "block"; b.onclick = enviar;
  }
</script>
</body>
</html>
